ght:950;color:#6b7280;margin-bottom:3px}.salesInfo .infoText{font-size:13px;line-height:1.45;color:#111827;font-weight:800}.officialLinkBox{margin-top:12px;border:1px solid #dbeafe;background:#eff6ff;border-radius:14px;padding:10px}.officialLinkBox .hint{font-size:12px;color:#1e40af;margin-top:4px;line-height:1.45}.officialBtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;background:#111827;color:#fff;border-radius:12px;padding:10px 12px;font-weight:950;font-size:13px;margin-top:8px}.officialBtn:hover{filter:brightness(1.05)}@media(max-width:720px){.salesInfo{grid-template-columns:1fr}.officialBtn{width:100%}}
    .orderItems{display:grid;gap:8px}.empty{padding:18px;text-align:center;color:#6b7280;background:#f9fafb;border:1px dashed #d1d5db;border-radius:14px}.lineItem{display:grid;grid-template-columns:58px 1fr auto;gap:9px;border:1px solid var(--line);border-radius:15px;padding:9px;background:#fff}.lineItem .thumb{width:58px;height:58px;border-radius:12px}.lineItem .code{font-weight:950}.lineItem .name{font-size:12px;color:#4b5563;margin-top:2px;line-height:1.3}.lineItem .pack{font-size:12px;color:#3730a3;font-weight:800;margin-top:3px}.qtyCtl{display:flex;align-items:center;gap:6px;margin-top:7px}.qtyCtl button{width:34px;height:34px;padding:0;border-radius:10px;background:#eef2f7;color:#111827;border:1px solid #d1d5db}.qtyCtl input{width:56px;text-align:center;padding:8px;border-radius:10px;font-weight:800}.subtotal{font-weight:950;text-align:right;margin-top:2px}.toolbar{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}@media(max-width:520px){.app{padding:10px 10px 190px}.topbar{margin:-10px -10px 10px;padding:10px}.hero{grid-template-columns:1fr;align-items:start}.heroControls{justify-content:space-between}.card{padding:11px;margin-bottom:10px}.searchCard{padding:9px}.toolbar{grid-template-columns:1fr}.searchLine{grid-template-columns:minmax(0,1fr) auto auto}.searchInput{font-size:18px;min-height:39px;padding:7px}.compactBtn{font-size:11px;padding:6px 7px}.keypadPanel{bottom:max(8px,env(safe-area-inset-bottom));width:190px;padding:7px}.keypadPanel.minimized{width:126px}.keypadPanel.side-right{right:8px}.keypadPanel.side-left{left:8px}.keypad{max-width:176px;gap:5px}.keypad button{height:39px}.product{grid-template-columns:64px 1fr}.productActions{grid-column:1/-1;grid-template-columns:1fr 1fr;display:grid}.productActions button,.productActions .price{width:100%;text-align:center}.lineItem{grid-template-columns:54px 1fr}.lineItem .right{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;align-items:center}}
    .miniGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.miniGrid{grid-template-columns:1fr}}.notice{border-radius:14px;padding:11px 12px;font-size:13px;line-height:1.5;background:#fffbeb;color:#78350f;border:1px solid #fde68a;margin:10px 0}.notice.ok{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}.notice.danger{background:#fef2f2;color:#991b1b;border-color:#fecaca}.mutedBox{background:#f9fafb;border:1px solid #e5e7eb;border-radius:14px;padding:10px}

<body>
  <main class="app">
    <div class="topbar">
      <section class="hero">
        <div class="totalBox"><div class="totalLabel" data-i18n="totalLabel">合計</div><div id="grandTotal" class="total">₩0</div></div>
        <div class="heroControls">
          <label class="priceSwitch" for="priceModeToggle">
            <input id="priceModeToggle" type="checkbox" checked />
            <span class="switchTrack"></span>
            <span id="priceModeText" data-i18n="priceWith">価格表示</span>
          </label>
          <label class="langMini"><span data-i18n="displayLanguage">言語</span>
            <select id="langSelect">
              <option value="ja">日本語</option><option value="en">English</option><option value="ko">한국어</option><option value="zh">中文</option>
            </select>
          </label>
        </div>
      </section>
    </div>

    <section class="grid">
      <div>
        <section class="card searchCard">
          <h2 class="searchHead"><span data-i18n="searchTitle">品番検索</span><button class="secondary keypadOpenBtn" id="openKeypad" type="button">テンキー</button></h2>
          <input id="productCount" type="hidden" value="" />
          <div class="searchLine">
            <input id="searchInput" class="searchInput" type="text" inputmode="none" placeholder="品番 / Keyword" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" readonly aria-label="Product code search" />
            <button class="secondary compactBtn" id="clearSearch" data-i18n="clear">クリア</button>
            <button class="secondary compactBtn" id="toggleMode" data-i18n="swap">左右</button>
          </div>
          <div class="keypadPanel open side-right" id="keypadPanel" aria-label="Number keypad">
            <div class="keypadHead" id="keypadHandle">
              <div><b>テンキー</b><div class="hint">下部固定</div></div>
              <div class="keypadTools"><button class="keypadMove" id="toggleKeypadMode" type="button">英字</button><button class="keypadMove" id="toggleKeypadSide" type="button">左へ</button><button class="keypadClose" id="closeKeypad" type="button">畳む</button></div>
            </div>
            <div class="keypad" id="keypad"></div>
          </div>
          <div id="results" class="resultList"></div>
        </section>

        <div class="systemControls" aria-hidden="true">
          <div id="autoLoadNotice"></div>
          <input id="fileInput" type="file" accept=".csv,.xlsx,.xls" tabindex="-1" />
          <select id="currencySelect" tabindex="-1"><option value="KRW">KRW / ₩</option><option value="JPY">JPY / ¥</option><option value="USD">USD / $</option><option value="CNY">CNY / CN¥</option></select>
          <select id="priceMode" tabindex="-1"><option value="with">価格ありPDF</option><option value="without">価格なしPDF</option></select>
        </div>
      </div>

      <div>
        <section class="card keypadHideZone"><h2 data-i18n="orderTitle">注文明細</h2><div id="orderItems" class="orderItems"></div><div class="toolbar"><button class="danger" id="clearOrder" data-i18n="clearOrder">明細を全クリア</button><button class="secondary" id="saveHistory" data-i18n="saveHistory">履歴に保存</button></div></section>
        <section class="card keypadHideZone"><h2><span data-i18n="customerTitle">お客様情報</span> <span class="hint" data-i18n="optional">任意・最小限</span></h2><div class="miniGrid"><label>Company<input id="customerCompany" placeholder="未入力でもOK" /></label><label>Distributor<input id="distributor" /></label><label>Staff<input id="staffName" /></label><label>Event<input id="eventName" /></label></div><label style="display:block;margin-top:10px">Notes<textarea id="notes" placeholder="サンプル希望・後日確認など"></textarea></label><div class="notice" data-i18n="privacyNotice">個人連絡先の入力は不要です。必要な場合のみ会社名やメモを入力してください。</div><button class="full" id="createQr" data-i18n="createQr">QR控えを作成</button></section>
        <section class="card keypadHideZone"><h2 data-i18n="historyTitle">過去の注文履歴</h2><div id="historyList" class="hint">履歴がありません。</div><div class="toolbar"><button class="secondary" id="exportHistory" data-i18n="exportHistory">履歴CSV出力</button><button class="danger" id="clearHistory" data-i18n="clearHistory">履歴を全削除</button></div></section>
      </div>
    </section>
  </main>

  <dialog id="detailDialog"><div class="modalHead"><b data-i18n="productDetail">商品詳細</b><button class="secondary small" id="closeDetail" data-i18n="close">閉じる</button></div><div id="detailBody" class="modalBody"></div></dialog>
  <dialog id="qrDialog"><div class="modalHead"><b data-i18n="qrTitle">QR控えをお客様に読み込んでもらう</b><button class="secondary small" id="closeQr" data-i18n="close">閉じる</button></div><div class="modalBody qrWrap"><div id="qrCode"></div><div class="hint" data-i18n="qrHint">お客様はQRを読み込むだけで、控えページを開けます。メール・LINEの聞き取りは不要です。</div><div id="qrWarning" class="notice" style="display:none"></div><div class="mono" id="receiptUrl"></div><div class="row wrap" style="justify-content:center"><button id="openReceipt" class="ok" data-i18n="openReceipt">控えページを開く</button><button id="copyUrl" class="secondary" data-i18n="copyUrl">URLコピー</button><button id="newOrder" class="secondary" data-i18n="newOrder">新しい注文へ</button></div></div></dialog>

  <section class="receiptPage"><div class="receiptActions"><select id="receiptLangSelect" style="max-width:180px"><option value="ja">日本語</option><option value="en">English</option><option value="ko">한국어</option><option value="zh">中文</option></select><button id="downloadPdf" class="ok">PDF Download</button><button id="printReceipt" class="secondary">Print / Save PDF</button><button id="backToApp" class="secondary">Back</button></div><div id="receiptPrintArea" class="receiptSheet"></div></section>

  <script src="vendor/qrcode.min.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/html2canvas.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script>
    const DATA_FILE = 'product_master_multilingual.csv';
    const LIB_FILES = { QRCode:'vendor/qrcode.min.js', XLSX:'vendor/xlsx.full.min.js', html2canvas:'vendor/html2canvas.min.js', jspdf:'vendor/jspdf.umd.min.js' };

    function cleanProductCode(raw){
      let v=String(raw||'').trim();
      const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
      let m=v.match(/^(\d{1,2})月(\d{1,2})日$/);
      if(m) return `${Number(m[2])}-${Number(m[1])}`;
      m=v.match(/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)-(\d{1,4})$/i);
      if(m){ const mon=months[m[1].toLowerCase().slice(0,3)], y=String(Number(m[2])); if(mon===10 && y==='73') return '2073-10'; return `${y}-${mon}`; }
      m=v.match(/^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})$/);
      if(m){ const year=Number(m[1]), mon=Number(m[2]), day=Number(m[3]); if(year>=2000) return `${year}-${mon}-${day}`; return `${String(year).slice(-2)}-${mon}-${day}`; }
      return v.replace(/[－ー–—]/g,'-');
    }
    function normalizeSearchText(value){ return String(value||'').toLowerCase().trim().replace(/^no\.?\s*/,'').replace(/[\s_ー－―]/g,'-').replace(/[^a-z0-9\-]/g,''); }
    function productMatch(p,qRaw){
      const q = normalizeSearchText(qRaw);
      if(!q) return {rank:9,label:'',className:''};
      const code = normalizeSearchText(p.code);
      const codeNoDash = code.replace(/-/g,'');
      const qNoDash = q.replace(/-/g,'');
      if(code===q || codeNoDash===qNoDash) return {rank:0,label:'完全一致',className:'matchExact'};
      if(code.startsWith(q) || codeNoDash.startsWith(qNoDash)) return {rank:1,label:'前方一致',className:'matchPrefix'};
      if(code.includes(q) || codeNoDash.includes(qNoDash)) return {rank:2,label:'部分一致',className:'matchPartial'};

      return null;
    }

        while(remaining>0){
          pdf.addPage();
          position=margin-(imgH-remaining);
          pdf.addImage(imgData,'PNG',margin,position,imgW,imgH);
          remaining-=pageContentH;
        }
        const title=(area.textContent.match(/KO-\d+-[A-Z0-9]+/)||['order-receipt'])[0];
        const fileName=`${title}.pdf`;
        const blob=pdf.output('blob');
        const file=typeof File!=='undefined' ? new File([blob],fileName,{type:'application/pdf'}) : null;
        const url=URL.createObjectURL(blob);
        setPdfReadyLink(url,fileName);
        if(file && navigator.canShare?.({files:[file]})){
          try{
            await navigator.share({files:[file],title:fileName});
            return;
          }catch(shareErr){}
        }
        const a=document.createElement('a');
        a.href=url; a.download=fileName; a.rel='noopener';
        document.body.appendChild(a); a.click(); a.remove();
      }catch(err){
        alert('PDF download could not start. Please use Print / Save PDF.');
        window.print();
      }finally{
        if(btn){ btn.disabled=false; btn.textContent=oldText||receiptUiText('download',receiptLang); }
      }
    }
    function saveHistory(auto=false,data=null){ if(!order.length&&!data){alert('No items to save.');return;} const receipt=data||buildReceiptData(); const history=JSON.parse(localStorage.getItem('qrOrderHistory')||'[]'); history.unshift(receipt); localStorage.setItem('qrOrderHistory',JSON.stringify(history.slice(0,100))); renderHistory(); if(!auto)alert('Saved'); }
    function renderHistory(){ if(!$('historyList'))return; const history=JSON.parse(localStorage.getItem('qrOrderHistory')||'[]'); if(!history.length){$('historyList').textContent='履歴がありません。';return;} $('historyList').innerHTML=history.slice(0,8).map(h=>`<div style="padding:8px 0;border-bottom:1px solid #e5e7eb"><b>${sanitize(h.orderNo)}</b><br>${sanitize(h.date)} / ${sanitize(h.customerCompany||'No customer')} / ${fmt(h.total,h.currency,h.lang||currentLang())}</div>`).join(''); }
    function exportHistoryCsv(){ const history=JSON.parse(localStorage.getItem('qrOrderHistory')||'[]'); if(!history.length){alert('No history.');return;} const rows=[['order_no','date','event','customer','distributor','staff','code','product','description','pack_qty','qty','unit_price','subtotal','currency','notes']]; history.forEach(h=>(h.items||[]).forEach(i=>rows.push([h.orderNo,h.date,h.eventName,h.customerCompany,h.distributor,h.staffName,i.c,i.n,i.d||'',i.pack||'',i.q,i.p??'',i.p!=null?Number(i.p)*Number(i.q):'',h.currency,h.notes]))); const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n'); const blob=new Blob([new Uint8Array([0xEF,0xBB,0xBF]),csv],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='exhibition-order-history.csv'; a.click(); URL.revokeObjectURL(a.href); }
    window.addEventListener('DOMContentLoaded', init);
  </script>
